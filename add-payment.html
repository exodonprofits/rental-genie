<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Moved – Rental Genie</title>
<script>
/* add-payment.html was merged into the payment form on lease-rent-center.html (pre-launch audit P2 2.3). This page only keeps old links and
   bookmarks working: it forwards to the new place, keeping the query string. */
(function () {
  var q = new URLSearchParams(location.search);
  var out = new URLSearchParams();
  if (q.get('property')) out.set('property', q.get('property'));
  if (q.get('id')) out.set('payment', q.get('id'));
  else out.set('pay', 'new');
  location.replace('lease-rent-center.html?' + out.toString());
})();
</script>
<style>
body { margin: 0; padding: 40px 20px; font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #0c1e3a; background: #f1f4f8; overflow-x: hidden; }
a { color: #1e5799; font-weight: 600; }
</style>
</head>
<body>
<p>This page has moved to <a href="lease-rent-center.html">the Lease &amp; Rent Center</a>.</p>
</body>
</html>
