# Page smoke tests (tests/smoke/). Runs on every pull request, and the "Deploy to Bluehost" workflow
# runs it first and deploys only if it passes, since merging is deploying.
#
#   1. Syntax-check every inline <script> in the top-level pages (node --check).
#   2. Load every page at 390px and 1280px with a stubbed Supabase client (no network, no live
#      database) and fail on an uncaught JavaScript error, a page that doesn't finish loading, or
#      sideways scrolling. Console errors, same-origin 404s and alert() dialogs are listed as
#      warnings in the run summary without failing it.
#   3. Workspace interactions (workspaces.js): search, filters, dialogs and keyboard paths on the
#      redesigned landlord and tenant workspaces at 320 to 2560px, plus simulated service failures
#      that must show "unavailable" rather than zero.
#   4. Accessibility (a11y.js): axe-core WCAG 2.1 A/AA rules on 20 landlord, tenant and public pages at
#      390px and 1280px; fails on any critical or serious violation (contrast, missing labels, ...).
#
# Screenshots of failing pages are uploaded as the "smoke-screenshots" artifact.

name: Smoke tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/smoke
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/smoke/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Syntax-check inline scripts
        run: node check-scripts.js

      - name: Stripe helper and webhook tests (online rent payments)
        run: |
          node --experimental-strip-types ../stripe/stripe.test.ts
          node --experimental-strip-types ../stripe/webhook.test.ts

      # Browser first, then its system packages as a best effort: --with-deps pulls fonts and
      # libraries from the Ubuntu mirror, and when that mirror is unreachable from the runner
      # (Nov 11 2026: "Temporary failure resolving azure.archive.ubuntu.com") apt retries until the
      # step times out and nothing can deploy. GitHub's Ubuntu image already has the libraries
      # Chromium needs; if it still can't start, the test steps below fail loudly.
      - name: Install Chromium
        run: |
          npx playwright install chromium
          timeout 180 npx playwright install-deps chromium || echo "::warning::Playwright system packages not installed (Ubuntu mirror unavailable?); using the runner's preinstalled libraries."

      - name: Load every page (phone and desktop)
        run: node run.js

      - name: Workspace interactions and unavailable-data handling (320 to 2560px)
        run: node workspaces.js

      - name: Accessibility (axe-core, WCAG 2.1 A/AA)
        run: node a11y.js

      - name: Upload screenshots of failing pages
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: tests/smoke/artifacts/
          if-no-files-found: ignore
