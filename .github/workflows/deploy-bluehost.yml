# Deploy the site to Bluehost (rentalgenieai.com) over FTPS.
#
# Every push to main deploys to production while the repository variable DEPLOY_ON_PUSH is "true".
# Run it by hand from the Actions tab ("Deploy to Bluehost" → Run workflow) to redeploy the current
# main, e.g. after a file was changed on the server by hand. There is no staging target: a copy of the
# site would use the same live database, so it isn't a safe test environment. Pages are checked with
# screenshots at desktop and phone widths before they're merged, and the deploy job runs only after
# the page smoke tests (smoke-tests.yml) pass on the commit being deployed.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   BLUEHOST_FTP_SERVER    e.g. ftp.rentalgenieai.com
#   BLUEHOST_FTP_USERNAME  an FTP account limited to the site's folder (cPanel → FTP Accounts)
#   BLUEHOST_FTP_PASSWORD
#   BLUEHOST_REMOTE_DIR    rentalgenieai.com's document root as that FTP account sees it, ending in "/".
#                          rentalgenieai.com is an add-on domain, so this is NOT the account's public_html
#                          root (that serves hhf.cbz.mybluehost.me); see Domains → rentalgenieai.com.
#
# Every deploy writes rg-version.txt (the commit SHA) and then fetches it back from
# https://rentalgenieai.com/rg-version.txt. If the site doesn't serve that SHA, the files went to
# the wrong folder and the run fails. A first run caught exactly that.
#
# Only the site goes up: every top-level .html page, images/ and shared/. Never supabase/, json/,
# .github/ or the markdown notes. The action keeps a sync-state file on the server and uploads only
# what changed; it removes files it uploaded earlier and that are gone from the repo, but never
# touches files it didn't put there. The hand-uploaded legacy pages were removed on 2026-10-04; the
# Salon and Voyage pages and landing.html / rent-analyzer.html in the same folder are left alone.

name: Deploy to Bluehost

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-bluehost-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The page smoke tests (.github/workflows/smoke-tests.yml) must pass before anything goes live.
  smoke:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ON_PUSH == 'true'
    uses: ./.github/workflows/smoke-tests.yml

  deploy:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site
          cp ./*.html site/
          cp -r images shared site/
          # Never publish these, even if they end up next to the pages.
          find site -name '*.md' -delete
          echo "$GITHUB_SHA" > site/rg-version.txt
          echo "Files to deploy: $(find site -type f | wc -l)"
          # Fail if anything secret-looking slipped in.
          if grep -rlE 'service_role|SUPABASE_SERVICE_ROLE|sk-ant-' site; then
            echo "Refusing to deploy: a file above contains a secret-looking string." >&2
            exit 1
          fi

      - name: Pick the remote folder
        id: dir
        env:
          BASE: ${{ secrets.BLUEHOST_REMOTE_DIR }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ]; then echo "BLUEHOST_REMOTE_DIR is not set" >&2; exit 1; fi
          case "$BASE" in */) ;; *) BASE="$BASE/";; esac
          echo "dir=$BASE" >> "$GITHUB_OUTPUT"
          echo "url=https://rentalgenieai.com/" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $BASE → https://rentalgenieai.com/"

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.BLUEHOST_FTP_SERVER }}
          username: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          password: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ${{ steps.dir.outputs.dir }}
          state-name: .rg-deploy-state.json

      - name: Check the site serves this commit
        env:
          URL: ${{ steps.dir.outputs.url }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS -H 'Cache-Control: no-cache' "${URL}rg-version.txt?t=$(date +%s)" | tr -d '[:space:]' || true)
            if [ "$got" = "$GITHUB_SHA" ]; then echo "OK: ${URL} serves $GITHUB_SHA"; exit 0; fi
            echo "Attempt $i: ${URL}rg-version.txt returned '${got:-nothing}'"; sleep 10
          done
          echo "The upload finished but ${URL} doesn't serve it. BLUEHOST_REMOTE_DIR probably points at the wrong folder." >&2
          exit 1
